name = "warranty-tracker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "warranty-tracker-db"
database_id = "d787e3b8-01b5-4e8e-92d7-b9b817ee9bb2"

# Serves the /public folder (login page + dashboard) directly from this same Worker.
[assets]
directory = "./public"
binding = "ASSETS"

[triggers]
# Runs daily at 07:00 UTC to check upcoming warranty expirations and send notifications
crons = ["0 7 * * *"]

[vars]
# Public, non-secret config
APP_NAME = "Warranty Tracker"

# --- Secrets (set these with `wrangler secret put <NAME>`, do NOT put real values here) ---
# JWT_SECRET            - random long string used to sign auth tokens
# DELL_CLIENT_ID        - from techdirect.dell.com (Warranty API)
# DELL_CLIENT_SECRET    - from techdirect.dell.com
# HP_CLIENT_ID          - from developers.hp.com (HP Warranty API / Proactive Insights)
# HP_CLIENT_SECRET      - from developers.hp.com
# RESEND_API_KEY        - for email notifications (resend.com), or swap for your own provider
# SLACK_WEBHOOK_URL     - optional, for Slack notifications
